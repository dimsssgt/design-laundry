<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Pesanan satuan — Laundyku</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}a{color:inherit;text-decoration:none}
.d{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:1;margin:0}
.mono{font-family:'Space Mono',monospace;font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--b);color:#fff;font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:13px;padding:10px 22px;border-radius:999px;min-height:44px;box-sizing:border-box;border:0;cursor:pointer}
.card{background:#fff;border:2px solid var(--k);border-radius:18px;box-shadow:5px 5px 0 var(--k);padding:28px;color:var(--k)}
.chip{display:inline-block;border:2px solid var(--k);border-radius:999px;padding:3px 12px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;background:var(--c);white-space:nowrap}
.chip.b{background:var(--b);color:#fff}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:12px 10px;border-bottom:2px dashed #C9B98F;text-align:left;font-family:'Space Mono',monospace;font-size:13px;vertical-align:middle}
th{font-size:11px;text-transform:uppercase}
label{display:block;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px 16px;border:2px solid var(--k);border-radius:12px;font-family:'Space Mono',monospace;font-size:13px;background:#fff;box-sizing:border-box;min-height:44px}
</style>
</head>
<body style="margin:0">

<div style="--b:#1457D6;--y:#FFD21F;--c:#FFF4DE;--r:#D42A25;--k:#0B2A6B;font-family:'Space Mono',monospace;color:var(--k);background:#EEF2F7;min-height:100%;padding:48px;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><h1 class="d" style="font-size:40px;color:var(--b)">Buat pesanan</h1><span class="chip b" style="padding:8px 16px">Drop mandiri</span></div>
<section id="drop" class="card" style="max-width:720px"><h2 class="d">Form drop mandiri</h2>
<p class="hint">Kamu mengantar cucian sendiri ke outlet. Alamat jemput dan jam jemput tidak diisi.</p>
<label>Jenis layanan</label><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip b" style="padding:8px 16px">Kiloan</span><span class="chip" style="padding:8px 16px">Satuan</span><span class="chip" style="padding:8px 16px">Linen</span></div>
<p class="mono" style="font-size:12px;margin:12px 0 0">Kiloan dihitung per kg, minimal 3 kg. Berat final ditentukan petugas saat penimbangan.</p>
<label>Kecepatan</label><select><option>Reguler · 3 hari</option><option>Express · 6 jam</option></select>
<label>Tanggal drop mandiri</label><input type="text" value="30 Okt 2026" placeholder="">
<label>Metode pengantaran</label><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip" style="padding:8px 16px">Antar jemput</span><span class="chip b" style="padding:8px 16px">Drop mandiri</span></div>
<label>Catatan (opsional)</label><textarea rows="4" placeholder="Cth: tanpa parfum"></textarea>
<div style="margin-top:20px"><a class="btn" href="#">Kirim pesanan</a></div></section>
</div>

</body></html>
