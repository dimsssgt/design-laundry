<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Laundyku</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
.hero-img{background:url(../assets/9e360cc717fd193a728833a4e16f58c2.webp) center / cover no-repeat}
body{margin:0}a{color:inherit;text-decoration:none}
.d{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:1;margin:0}
.mono{font-family:'Space Mono',monospace;font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--b);color:#fff;font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:13px;padding:10px 22px;border-radius:999px;min-height:44px;box-sizing:border-box;border:0;cursor:pointer}
.btn.y{background:var(--y);color:var(--k);box-shadow:inset 0 0 0 2px var(--k)}
.btn.s{padding:6px 16px;min-height:40px;font-size:12px}
.card{background:#fff;border:2px solid var(--k);border-radius:18px;box-shadow:5px 5px 0 var(--k);padding:28px;color:var(--k)}
.chip{display:inline-block;border:2px solid var(--k);border-radius:999px;padding:3px 12px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;background:var(--c);white-space:nowrap}
.chip.y{background:var(--y)}.chip.b{background:var(--b);color:#fff}.chip.g{background:#12805C;color:#fff}.chip.r{background:var(--r);color:#fff}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100%}
.side{background:var(--b);color:#fff;padding:28px 20px;display:flex;flex-direction:column;gap:8px}
.side a{display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;text-transform:uppercase}
.side a.on{background:var(--y);color:var(--k)}
.main{padding:40px 48px;display:flex;flex-direction:column;gap:32px;background:#EEF2F7}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:12px 10px;border-bottom:2px dashed #C9B98F;text-align:left;font-family:'Space Mono',monospace;font-size:13px}
th{font-size:11px;text-transform:uppercase}
label{display:block;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px 16px;border:2px solid var(--k);border-radius:12px;font-family:'Space Mono',monospace;font-size:13px;background:#fff;box-sizing:border-box;min-height:44px}
h2.d{font-size:24px;color:var(--b);margin-bottom:16px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.main{padding:24px 20px}}
</style>
</head>
<body style="margin:0">

<div style="--b:#1457D6;--y:#FFD21F;--c:#FFF4DE;--r:#D42A25;--k:#0B2A6B;font-family:'Space Mono',monospace;color:var(--k);min-height:900px;background:#EEF2F7">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));min-height:900px">
<div style="background:var(--b);padding:64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px;overflow:hidden">
<a href="#" class="d" style="font-size:28px;color:var(--y)">Laundyku</a>
<div><h1 class="d" style="font-size:72px;color:var(--y)">Selamat datang kembali</h1><p class="mono" style="color:#fff;font-size:15px;max-width:420px;margin:24px 0 0">Masuk untuk memesan, memantau cucian, atau mengelola layanan laundry.</p></div>
<div style="width: 571px; height: 320px; border: 3px solid var(--k); display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; position: relative; top: -30px; border-top-left-radius: 24px; border-top-right-radius: 24px; border-bottom-right-radius: 24px; border-bottom-left-radius: 24px" class="hero-img mono"><br></div></div>
<div style="display:flex;align-items:center;justify-content:center;padding:48px;background:#FFF4DE"><div class="card" style="width:100%;max-width:460px;padding:40px">
<h2 class="d" style="font-size:32px;color:var(--b);margin-bottom:8px">Masuk</h2><p class="mono" style="margin:0 0 20px">Isi akunmu untuk masuk.</p>
<label>Email / No. WhatsApp</label><input type="text" value="" placeholder="nama@email.com"><label>Password</label><input type="text" value="" placeholder="••••••••">
<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 24px" class="mono"><label style="display:flex;gap:8px;align-items:center;margin:0;text-transform:none"><input type="checkbox" style="width:18px;height:18px;min-height:0"> Ingat saya</label><a href="#" style="text-decoration:underline">Lupa password?</a></div>
<a class="btn" href="#" style="width:100%">Masuk</a>
<div style="margin-top:24px;border:2px dashed var(--k);border-radius:14px;padding:14px;background:#fff"><div class="mono" style="font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:10px">Mode testing prototype</div><div style="display:flex;gap:8px;flex-wrap:wrap"><a href="#" class="chip y" style="padding:8px 16px">Masuk sebagai Pelanggan</a><a href="#" class="chip" style="padding:8px 16px;background:#fff">Masuk sebagai Petugas</a><a href="#" class="chip" style="padding:8px 16px;background:#fff">Masuk sebagai Admin</a></div></div>
<p class="mono" style="text-align:center;margin:20px 0 0">Belum punya akun? <a href="#" style="color:var(--b);font-weight:700;text-decoration:underline">Daftar</a></p></div></div></div>
</div>

</body></html>
