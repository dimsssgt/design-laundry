<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pop Up Konfirmasi Hapus — Laundyku</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}a{color:inherit;text-decoration:none}
.d{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:1;margin:0}
.mono{font-family:'Space Mono',monospace;font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--b);color:#fff;font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:13px;padding:10px 22px;border-radius:999px;min-height:44px;box-sizing:border-box;border:0;cursor:pointer}
.btn.y{background:var(--y);color:var(--k);box-shadow:inset 0 0 0 2px var(--k)}
.btn.r{background:var(--r);color:#fff}
</style>
</head>
<body style="margin:0">

<div style="--b:#1457D6;--y:#FFD21F;--c:#FFF4DE;--r:#D42A25;--k:#0B2A6B;font-family:'Space Mono',monospace;color:var(--k);background:rgba(11,42,107,.55);min-height:100%;padding:60px 28px;box-sizing:border-box;display:flex;align-items:center;justify-content:center">
<div style="background:#fff;border:2px solid var(--k);border-radius:22px;box-shadow:8px 8px 0 var(--k);width:100%;max-width:520px;padding:32px;box-sizing:border-box">
<h2 class="d" style="font-size:26px;color:var(--r)">Hapus transaksi?</h2>
<p class="mono" style="margin:14px 0 0">Transaksi <b>LDY-014</b> (Cuci Kiloan, Rp 29.000) akan dihapus dari daftar.</p>
<p class="mono" style="margin:10px 0 0;font-size:12px">Tindakan ini tidak bisa dibatalkan.</p>
<div style="display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-top:24px">
<a href="#" class="btn y">Batal</a>
<a href="#" class="btn r">Ya, hapus</a>
</div></div></div>


</body></html>
