<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Terima pesanan — Laundyku</title></head>
<body><x-dc><helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}a{color:inherit;text-decoration:none}
.d{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1;margin:0}
.mono{font-family:'Space Mono',monospace;font-size:14px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;background:var(--b);color:#fff;font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:15px;padding:0 20px;border-radius:14px;min-height:56px;box-sizing:border-box;border:0;cursor:pointer;width:100%}
.btn.y{background:var(--y);color:var(--k);box-shadow:inset 0 0 0 2px var(--k)}
.btn.r{background:var(--r);color:#fff}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed #C9B98F;font-family:'Space Mono',monospace;font-size:13px}
.row span:first-child{color:#4A5A80}
</style></helmet>
<div style="--b:#1457D6;--y:#FFD21F;--c:#FFF4DE;--r:#D42A25;--k:#0B2A6B;font-family:'Space Mono',monospace;color:var(--k);min-height:560px;background:#33477E;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
<div style="width:100%;max-width:380px;background:#fff;border:2px solid var(--k);border-radius:24px;box-shadow:6px 6px 0 var(--k);padding:26px;box-sizing:border-box">
<h2 class="d" style="font-size:22px;color:#1457D6">Terima pesanan?</h2>
<p class="mono" style="margin:12px 0 0">Pesanan akan masuk ke tahap diterima setelah berat dan harga disimpan.</p>
<div style="margin-top:14px"><div class="row"><span>Kode</span><b style="text-align:right">LDY-015</b></div><div class="row"><span>Berat</span><b style="text-align:right">4 kg</b></div><div class="row"><span>Total</span><b style="text-align:right">Rp 40.000</b></div></div>
<div style="display:grid;gap:10px;margin-top:22px">
<a class="btn " href="#">Ya, terima</a>
<a class="btn y" href="#">Kembali</a>
</div>
</div></div>
</x-dc>
</body></html>
