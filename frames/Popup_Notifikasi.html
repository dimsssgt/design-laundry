<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Pop Up Notifikasi — Laundyku</title></head>
<body><x-dc><helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit;text-decoration:none;cursor:pointer}
.d{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:1.1;margin:0}
.mono{font-family:'Space Mono',monospace;font-size:13px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--b);color:#fff;font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:13px;padding:10px 20px;border-radius:999px;min-height:44px;border:0;cursor:pointer;box-sizing:border-box}
.btn.y{background:var(--y);color:var(--k);box-shadow:inset 0 0 0 2px var(--k)}
.card{background:#fff;border:2px solid var(--k);border-radius:18px;box-shadow:5px 5px 0 var(--k);padding:24px}
.chip{display:inline-block;border:2px solid var(--k);border-radius:999px;padding:3px 12px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;background:var(--c);white-space:nowrap}
.chip.y{background:var(--y)}.chip.b{background:var(--b);color:#fff}.chip.r{background:var(--r);color:#fff}</style></helmet>
<div style="--b:#1457D6;--y:#FFD21F;--c:#FFF4DE;--r:#D42A25;--k:#0B2A6B;font-family:'Space Mono',monospace;color:var(--k);min-height:620px;background:#33477E;display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
<div class="card" style="width:100%;max-width:440px;padding:24px;box-sizing:border-box;box-shadow:6px 6px 0 var(--k)">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h2 class="d" style="font-size:22px;color:var(--b)">Notifikasi</h2><span class="btn y" style="padding:0;width:40px;min-width:40px;min-height:40px">✕</span></div>
<div style="margin-top:8px"><div style="display:flex;gap:12px;padding:14px 0;border-bottom:2px dashed #C9B98F"><span style="width:12px;height:12px;border-radius:50%;background:var(--r);border:2px solid var(--k);flex-shrink:0;margin-top:6px;"></span><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Pesanan diterima petugas</b><span class="mono" style="font-size:12px;color:#4A5A80">2 menit lalu</span></div><div class="mono" style="font-size:13px;margin-top:4px">LDY-20261030-016 sudah diterima dan akan ditimbang.</div></div></div><div style="display:flex;gap:12px;padding:14px 0;border-bottom:2px dashed #C9B98F"><span style="width:12px;height:12px;border-radius:50%;background:var(--r);border:2px solid var(--k);flex-shrink:0;margin-top:6px;"></span><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Cucian siap diambil</b><span class="mono" style="font-size:12px;color:#4A5A80">1 jam lalu</span></div><div class="mono" style="font-size:13px;margin-top:4px">LDY-20261028-014 sudah selesai dan siap diantar atau diambil.</div></div></div><div style="display:flex;gap:12px;padding:14px 0;border-bottom:2px dashed #C9B98F"><span style="width:12px;height:12px;border-radius:50%;background:var(--r);border:2px solid var(--k);flex-shrink:0;margin-top:6px;opacity:0"></span><div style="flex:1"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>Tagihan belum dibayar</b><span class="mono" style="font-size:12px;color:#4A5A80">Kemarin, 16.30</span></div><div class="mono" style="font-size:13px;margin-top:4px">LDY-20261029-015 menunggu pembayaran via QRIS.</div></div></div></div>
<div style="display:flex;justify-content:flex-end;margin-top:18px"><a class="btn" href="#">Lihat semua →</a></div>
</div></div>
</x-dc>
</body></html>
