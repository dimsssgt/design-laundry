<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Popup · Ubah harga — Laundyku</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}a{color:inherit;text-decoration:none}
.d{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;line-height:1;margin:0}
.mono{font-family:'Space Mono',monospace;font-size:13px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--b);color:#fff;font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:13px;padding:10px 22px;border-radius:999px;min-height:44px;box-sizing:border-box;border:0;cursor:pointer}
.btn.y{background:var(--y);color:var(--k);box-shadow:inset 0 0 0 2px var(--k)}
.btn.s{padding:6px 16px;min-height:40px;font-size:12px}
.card{background:#fff;border:2px solid var(--k);border-radius:18px;box-shadow:5px 5px 0 var(--k);padding:28px;color:var(--k)}
.chip{display:inline-block;border:2px solid var(--k);border-radius:999px;padding:3px 12px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;background:var(--c);white-space:nowrap}
.chip.y{background:var(--y)}.chip.b{background:var(--b);color:#fff}.chip.g{background:#12805C;color:#fff}.chip.r{background:var(--r);color:#fff}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100%}
.side{background:var(--b);color:#fff;padding:28px 20px;display:flex;flex-direction:column;gap:8px}
.side a{display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;text-transform:uppercase}
.side a.on{background:var(--y);color:var(--k)}
.main{padding:40px 48px;display:flex;flex-direction:column;gap:32px;background:#EEF2F7}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:12px 10px;border-bottom:2px dashed #C9B98F;text-align:left;font-family:'Space Mono',monospace;font-size:13px}
th{font-size:11px;text-transform:uppercase}
label{display:block;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
input,select,textarea{width:100%;padding:12px 16px;border:2px solid var(--k);border-radius:12px;font-family:'Space Mono',monospace;font-size:13px;background:#fff;box-sizing:border-box;min-height:44px}
h2.d{font-size:24px;color:var(--b);margin-bottom:16px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.main{padding:24px 20px}}
</style>
</head>
<body style="margin:0">

<div style="--b:#1457D6;--y:#FFD21F;--c:#FFF4DE;--r:#D42A25;--k:#0B2A6B;font-family:'Space Mono',monospace;color:var(--k);min-height:760px;background:#EEF2F7">
<div style="min-height:760px;background:#33477E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px 20px;box-sizing:border-box">
<div class="mono" style="color:#fff;font-size:12px;text-align:center;max-width:420px">Muncul dari tombol “Ubah” · Dashboard Admin</div>
<div class="card" style="width:100%;max-width:420px;padding:28px;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px"><h2 class="d" style="font-size:22px;color:var(--b);margin:0">Ubah harga</h2><span class="btn y s" style="padding:0;width:44px;min-width:44px">✕</span></div>
<label>Layanan</label><select><option>Cuci Kiloan</option></select><label>Satuan</label><input type="text" value="per kg" placeholder=""><label>Harga reguler (Rp)</label><input type="text" value="5.000" placeholder=""><label>Harga express (Rp)</label><input type="text" value="10.000" placeholder=""><label>Berlaku mulai</label><input type="text" value="30 Okt 2026" placeholder=""><div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:24px"><a class="btn y " href="#">Batal</a><a class="btn  " href="#">Simpan harga</a></div></div></div>
</div>

</body></html>
